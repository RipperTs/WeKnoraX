name: Build and Push Docker Image
on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: registry.cn-hangzhou.aliyuncs.com
  REGISTRY_NAMESPACE: ripper
  NODE_VERSION: "24"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      base_tag: ${{ steps.baseline.outputs.tag }}
      ui: ${{ steps.changes.outputs.ui }}
      docreader: ${{ steps.changes.outputs.docreader }}
      sandbox: ${{ steps.changes.outputs.sandbox }}
      mcp: ${{ steps.changes.outputs.mcp }}
      odl-hybrid: ${{ steps.changes.outputs.odl-hybrid }}
      app: ${{ steps.changes.outputs.app }}
      reuse: ${{ steps.changes.outputs.reuse }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Find previous successful release
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/workflows/docker-image.yml/runs?event=push&status=success&per_page=100" \
            > "$RUNNER_TEMP/successful-releases.json"
          baseline=$(jq -r --arg tag "$GITHUB_REF_NAME" --argjson run_number "$GITHUB_RUN_NUMBER" '
            [.[].workflow_runs[]
              | select(.run_number < $run_number and .head_branch != $tag)
              | select(.head_branch | startswith("v"))]
            | sort_by(.run_number) | last
            | if . == null then empty else [.head_branch, .head_sha] | @tsv end
          ' "$RUNNER_TEMP/successful-releases.json")

          if [ -z "$baseline" ]; then
            echo "No previous successful release; building all images." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          IFS=$'\t' read -r base_tag base_sha <<< "$baseline"
          # Do not reuse a published tag whose Git reference has since moved.
          tag_sha=$(git rev-parse --verify "refs/tags/$base_tag^{commit}")
          if [ "$tag_sha" != "$base_sha" ]; then
            echo "::error::Published tag $base_tag no longer points to $base_sha"
            exit 1
          fi
          # Match docker/metadata-action's Docker tag normalization.
          image_tag=$(printf '%s' "$base_tag" | sed -E 's/[^a-zA-Z0-9_.-]+/-/g')
          echo "tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "Release baseline: $base_tag ($base_sha)" >> "$GITHUB_STEP_SUMMARY"

      - name: Detect image changes
        id: changes
        env:
          BASE_SHA: ${{ steps.baseline.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          reuse='[]'
          shared_paths=(.github/workflows/docker-image.yml .gitattributes)
          # These paths are not inputs to the images published by this workflow.
          # Keep the list explicit: new, unclassified paths must stop the release.
          classified_paths=(
            "${shared_paths[@]}"
            .air.toml .codex/environments/environment.toml .env.example .env.lite.example
            .gitignore .golangci.yml AGENTS.md CHANGELOG.md LICENSE ':(glob)README*.md' SECURITY.md
            .github/dependabot.yml .github/pull_request_template.md
            .github/workflows/anydoc.yml .github/workflows/app.yml .github/workflows/cli.yml
            .github/workflows/docreader.yml .github/workflows/frontend.yml
            .github/workflows/go-lint.yml .github/workflows/mcp-server.yml
            Formula cli client cmd/desktop deploy helm miniprogram website-docs examples
            docker-compose.dev.yml docker-compose.yml
            docker/config/supervisord.conf docker/searxng/settings.yml misc/dex-config.yaml
            dataset/README dataset/README_zh.md dataset/qa_dataset.py
            ':(glob)docs/**/*.md' docs/images docs/poc docs/swagger.json docs/swagger.yaml
            testdata tests/miniprogram package-lock.json rerank_server_demo.py test_agent_config.sh
          )
          check_image() {
            local image="$1" changed=true diff_status
            shift
            # Use the same image paths for change detection and classification.
            classified_paths+=("$@")
            if [ -n "$BASE_SHA" ]; then
              # Shared build and checkout rules invalidate every image.
              if git diff --quiet --no-renames "$BASE_SHA" "$GITHUB_SHA" -- "${shared_paths[@]}" "$@"; then
                changed=false
              else
                diff_status=$?
                if [ "$diff_status" -ne 1 ]; then
                  return "$diff_status"
                fi
              fi
            fi
            echo "$image=$changed" >> "$GITHUB_OUTPUT"
            if [ "$changed" = true ]; then
              echo "| $image | Build |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| $image | Reuse |" >> "$GITHUB_STEP_SUMMARY"
              reuse=$(jq -c --arg image "$image" '. + [{image: $image, suffix: ""}]' <<< "$reuse")
              if [ "$image" = sandbox ]; then
                reuse=$(jq -c '. + [{image: "sandbox", suffix: "-cube"}]' <<< "$reuse")
              fi
            fi
          }

          printf '\n| Image | Action |\n| --- | --- |\n' >> "$GITHUB_STEP_SUMMARY"
          check_image ui frontend scripts/build_frontend_dist.sh scripts/get_version.sh
          check_image docreader docreader packages docker/Dockerfile.docreader .dockerignore
          check_image sandbox docker/Dockerfile.sandbox .dockerignore
          check_image mcp mcp-server
          check_image odl-hybrid docker/Dockerfile.odl-hybrid .dockerignore
          # Include compiled Go dependencies and files copied into the runtime image.
          check_image app cmd/server cmd/download internal ':(glob)docs/*.go' \
            docreader/client ':(glob)docreader/proto/*.go' third_party/anydoc-go \
            go.mod go.sum Makefile VERSION scripts config migrations dataset/samples \
            skills/preloaded docker/Dockerfile.app .dockerignore

          if [ -n "$BASE_SHA" ]; then
            # Disable rename detection so both the old and new paths are classified.
            # Git quotes filenames containing line breaks, keeping one path per line.
            git diff --name-only --no-renames "$BASE_SHA" "$GITHUB_SHA" > "$RUNNER_TEMP/all-changes.txt"
            git diff --name-only --no-renames "$BASE_SHA" "$GITHUB_SHA" -- "${classified_paths[@]}" \
              > "$RUNNER_TEMP/classified-changes.txt"
            LC_ALL=C sort -u "$RUNNER_TEMP/all-changes.txt" -o "$RUNNER_TEMP/all-changes.txt"
            LC_ALL=C sort -u "$RUNNER_TEMP/classified-changes.txt" -o "$RUNNER_TEMP/classified-changes.txt"
            LC_ALL=C comm -23 "$RUNNER_TEMP/all-changes.txt" "$RUNNER_TEMP/classified-changes.txt" \
              > "$RUNNER_TEMP/unclassified-changes.txt"
            if [ -s "$RUNNER_TEMP/unclassified-changes.txt" ]; then
              echo "::error::Unclassified changed files. Add them to an image's paths or the explicit non-image paths."
              cat "$RUNNER_TEMP/unclassified-changes.txt"
              {
                printf '\nUnclassified changed files; release stopped:\n\n```text\n'
                cat "$RUNNER_TEMP/unclassified-changes.txt"
                printf '```\n'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi
          echo "reuse=$reuse" >> "$GITHUB_OUTPUT"

  reuse-images:
    needs: changes
    if: needs.changes.outputs.reuse != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.reuse) }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/weknora-${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=ref,event=tag,suffix=${{ matrix.suffix }}
            type=raw,value=latest${{ matrix.suffix }}

      - name: Publish existing image with release tags
        env:
          SOURCE_IMAGE: ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/weknora-${{ matrix.image }}:${{ needs.changes.outputs.base_tag }}${{ matrix.suffix }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        shell: bash
        run: |
          set -euo pipefail
          tags=()
          while IFS= read -r tag; do
            tags+=(--tag "$tag")
          done <<< "$IMAGE_TAGS"
          # Preserve both multi-platform indexes and the single-platform Cube manifest.
          docker buildx imagetools create --prefer-index=false "${tags[@]}" "$SOURCE_IMAGE"

  build-ui:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Prepare version info
        id: version
        run: |
          eval "$(./scripts/get_version.sh env)"
          echo "commit_id=$COMMIT_ID" >> $GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          VITE_IS_DOCKER: true
          VITE_FRONTEND_COMMIT: ${{ steps.version.outputs.commit_id }}
        run: ./scripts/build_frontend_dist.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/weknora-ui
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build ui Image
        uses: docker/build-push-action@v7
        with:
          push: true
          provenance: false
          platforms: linux/amd64,linux/arm64
          file: frontend/Dockerfile
          context: ./frontend
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=build-ui
          cache-to: type=gha,scope=build-ui,mode=max

  build-docreader:
    needs: changes
    if: needs.changes.outputs.docreader == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: false
          
          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/weknora-docreader
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build docreader Image
        uses: docker/build-push-action@v7
        with:
          push: true
          provenance: false
          platforms: linux/amd64,linux/arm64
          file: docker/Dockerfile.docreader
          context: .
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=build-docreader
          cache-to: type=gha,scope=build-docreader,mode=max

  build-sandbox:
    needs: changes
    if: needs.changes.outputs.sandbox == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/weknora-sandbox
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build sandbox Image
        uses: docker/build-push-action@v7
        with:
          push: true
          provenance: false
          platforms: linux/amd64,linux/arm64
          file: docker/Dockerfile.sandbox
          target: sandbox
          context: .
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=build-sandbox
          cache-to: type=gha,scope=build-sandbox,mode=max

      # Cube builds templates straight from the image and gates the build on
      # GET :49983/health, so it needs the variant with envd baked in.
      - name: Docker meta (Cube variant)
        id: meta-cube
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/weknora-sandbox
          flavor: latest=false
          tags: |
            type=ref,event=tag,suffix=-cube
            type=raw,value=latest-cube

      # amd64 only: cubesandbox-base, the source of the envd binary, publishes
      # no arm64 image.
      - name: Build sandbox Cube Image
        uses: docker/build-push-action@v7
        with:
          push: true
          provenance: false
          platforms: linux/amd64
          file: docker/Dockerfile.sandbox
          target: cube
          context: .
          labels: ${{ steps.meta-cube.outputs.labels }}
          tags: ${{ steps.meta-cube.outputs.tags }}
          cache-from: type=gha,scope=build-sandbox-cube
          cache-to: type=gha,scope=build-sandbox-cube,mode=max

  build-mcp:
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/weknora-mcp
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build MCP Image
        uses: docker/build-push-action@v7
        with:
          push: true
          provenance: false
          platforms: linux/amd64,linux/arm64
          context: ./mcp-server
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=build-mcp
          cache-to: type=gha,scope=build-mcp,mode=max

  build-odl-hybrid:
    needs: changes
    if: needs.changes.outputs.odl-hybrid == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/weknora-odl-hybrid
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build ODL Hybrid Image
        uses: docker/build-push-action@v7
        with:
          push: true
          provenance: false
          platforms: linux/amd64,linux/arm64
          file: docker/Dockerfile.odl-hybrid
          context: .
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=build-odl-hybrid
          cache-to: type=gha,scope=build-odl-hybrid,mode=max

  build-app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runs: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runs: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs }}
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/weknora-app
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Prepare version info
        id: version
        run: |
          # 使用统一的版本管理脚本
          eval "$(./scripts/get_version.sh env)"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "commit_id=$COMMIT_ID" >> $GITHUB_OUTPUT
          echo "build_time=$BUILD_TIME" >> $GITHUB_OUTPUT
          echo "go_version=$GO_VERSION" >> $GITHUB_OUTPUT
          
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
          # 显示版本信息
          ./scripts/get_version.sh info
      
      - name: Build app Image
        id: build
        uses: docker/build-push-action@v7
        with:
          push: true
          provenance: false
          platforms: ${{ matrix.platform }}
          file: docker/Dockerfile.app
          context: .
          build-args: |
            ${{ format('VERSION_ARG={0}', steps.version.outputs.version) }}
            ${{ format('COMMIT_ID_ARG={0}', steps.version.outputs.commit_id) }}
            ${{ format('BUILD_TIME_ARG={0}', steps.version.outputs.build_time) }}
            ${{ format('GO_VERSION_ARG={0}', steps.version.outputs.go_version) }}
            WITH_ANYDOC=1
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/weknora-app
          cache-from: type=gha,scope=build-app-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=build-app-${{ env.PLATFORM_PAIR }},mode=max
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs:
      - build-app
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/weknora-app
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/weknora-app@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/weknora-app:${{ steps.meta.outputs.version }}
